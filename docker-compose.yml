services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    image: python:3.12
    container_name: air_alerts_producer
    depends_on:
      - kafka
    volumes:
      - ./data/processed:/app/data/processed
      - ./kafka_producer.py:/app/kafka_producer.py
      - ./scripts.py:/app/scripts.py
      - ./requirements.txt:/app/requirements.txt
      - ./logs:/app/logs
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && sleep 15 && python kafka_producer.py"

  consumer:
    image: python:3.12
    container_name: air_alerts_consumer
    depends_on:
      - kafka
      - postgres
    environment:
      DB_HOST: postgres
    volumes:
      - ./data/kafka_output:/app/data/kafka_output
      - ./kafka_consumer.py:/app/kafka_consumer.py
      - ./scripts.py:/app/scripts.py
      - ./db.py:/app/db.py
      - ./repository.py:/app/repository.py
      - ./requirements.txt:/app/requirements.txt
      - ./.secrets:/app/.secrets
      - ./logs:/app/logs
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && sleep 25 && python kafka_consumer.py"

  postgres:
    image: postgres:16
    container_name: air_alerts_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  spark:
    image: spark:4.1.2-java21-python3
    container_name: air_alerts_spark
    depends_on:
      - postgres
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./spark_processing.py:/app/spark_processing.py
      - ./data/processed:/app/data/processed
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/ivycache:/opt/spark/ivycache:rw
      - ./.secrets:/app/.secrets
    working_dir: /app
    command: sleep infinity

volumes:
  postgres_data:

